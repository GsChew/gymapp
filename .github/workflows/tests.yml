name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gymapp_test
          POSTGRES_USER: gym_test
          POSTGRES_PASSWORD: gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_test -d gymapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://gym_test:gym_test@127.0.0.1:5432/gymapp_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://gym_test:gym_test@127.0.0.1:5432/gymapp_test
      TEST_DATABASE_URL: postgresql+asyncpg://gym_test:gym_test@127.0.0.1:5432/gymapp_test
      TEST_ALEMBIC_DATABASE_URL: postgresql+psycopg://gym_test:gym_test@127.0.0.1:5432/gymapp_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: github-actions-test-secret-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CELERY_BROKER_URL: amqp://guest:guest@127.0.0.1:5672//
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      REDIS_URL: redis://127.0.0.1:6379/0
      LOG_LEVEL: WARNING
      LOG_DIR: /tmp/gymapp-test-logs
      LOG_JSON: "false"
      REQUIRE_TEST_INFRA: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint test framework
        run: ruff check tests

      - name: Smoke, unit, and contracts
        run: pytest -m "smoke or unit or contract" -q

      - name: API suite
        run: pytest -m api -q

      - name: Infrastructure integrations
        run: pytest -m integration -q

      - name: Selenium UI suite
        run: pytest -m "ui and selenium" -q

      - name: Playwright UI suite
        run: pytest -m "ui and playwright" -q

      - name: Full suite with coverage and Allure
        run: >-
          pytest -q
          --cov=src
          --cov=main
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --alluredir=allure-results

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
