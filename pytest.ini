[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers --strict-config
log_cli = false
log_level = INFO
filterwarnings =
    error
    ignore:'crypt' is deprecated:DeprecationWarning
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
markers =
    unit: isolated tests for schemas, helpers, dependencies, and services
    smoke: fast application startup and critical route checks
    contract: OpenAPI and response contract checks
    api: in-process HTTP API tests backed by isolated PostgreSQL
    integration: tests that use PostgreSQL, Redis, or Celery infrastructure
    database: PostgreSQL state and constraint checks
    celery: Celery registration, eager execution, and task behavior
    redis: real Redis integration checks
    auth: authentication and token lifecycle checks
    security: authorization and basic API security checks
    ui: browser end-to-end tests against the real FastAPI application
    selenium: UI tests implemented with Selenium WebDriver
    playwright: UI tests implemented with Playwright
    e2e: tests spanning browser, HTTP API, and PostgreSQL
    slow: browser or infrastructure scenarios with higher execution cost
    positive: successful business scenarios
    negative: validation, authorization, and error scenarios

[coverage:run]
branch = True
source =
    src
parallel = False

[coverage:report]
show_missing = True
skip_covered = True
precision = 2
fail_under = 80
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:

[coverage:html]
directory = htmlcov
